version: '3.8'

services:
  judge0-server:
    image: judge0/judge0:1.13.0
    container_name: judge0-server
    restart: always
    command: ["./scripts/server"]
    ports:
      - "2358:2358"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    environment:
      - AUTH_TOKEN=judge0_secret_api_key_2026
    depends_on:
      - judge0-db
      - judge0-redis
    networks:
      - mindcraft-network

  judge0-workers:
    image: judge0/judge0:1.13.0
    container_name: judge0-workers
    restart: always
    privileged: true
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - judge0-db
      - judge0-redis
    networks:
      - mindcraft-network

  judge0-db:
    image: postgres:13-alpine
    container_name: judge0-db
    restart: always
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      - POSTGRES_DB=judge0
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data
    networks:
      - mindcraft-network

  judge0-redis:
    image: redis:6-alpine
    container_name: judge0-redis
    restart: always
    volumes:
      - judge0-redis-data:/data
    networks:
      - mindcraft-network

volumes:
  judge0-postgres-data:
  judge0-redis-data:

networks:
  mindcraft-network:
    name: mindcraft-network
    external: true
